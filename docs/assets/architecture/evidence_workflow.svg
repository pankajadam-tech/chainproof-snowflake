-weight="450" fill="#FFFFFF" text-anchor="middle">accepted vs rejected quantity</text></g><line x1="485" y1="677" x2="690" y2="450" stroke="#9B8AFB" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="690" y="330" width="390" height="245" rx="30" fill="#102F3C" stroke="#34D399" stroke-width="4"/><text x="885" y="390" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="750" fill="#FFFFFF" text-anchor="middle">Data Steward</text><text x="885" y="430" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#34D399" text-anchor="middle">review packet</text><text x="885" y="485" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="550" fill="#DCEBFA" text-anchor="middle">cited evidence</text><text x="885" y="520" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="550" fill="#DCEBFA" text-anchor="middle">business impact</text><text x="885" y="555" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="550" fill="#DCEBFA" text-anchor="middle">recommended contract</text></g><line x1="1085" y1="452" x2="1285" y2="452" stroke="#34D399" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="1290" y="350" width="230" height="205" rx="28" fill="#0D2941" stroke="#F5B84B" stroke-width="3"/><text x="1405" y="405" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="750" fill="#F5B84B" text-anchor="middle">Human decision</text><text x="1405" y="455" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#34D399" text-anchor="middle">Approve</text><text x="1405" y="495" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="650" fill="#FF6B6B" text-anchor="middle">Reject</text><text x="1405" y="530" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">or request change</text></g><rect x="610" y="700" width="770" 