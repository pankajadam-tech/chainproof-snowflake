<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071B2E"/><stop offset="1" stop-color="#0A2238"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2E75FF"/><stop offset="1" stop-color="#32D5FF"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dx="0" dy="8" result="off"/><feComponentTransfer><feFuncA type="linear" slope="0.24"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#32D5FF"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1440" cy="80" r="220" fill="#0E3654" opacity="0.35"/>
  <circle cx="130" cy="850" r="260" fill="#0E3654" opacity="0.30"/>
  <text x="80" y="78" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="750" fill="#FFFFFF" text-anchor="start">Immutable metric lifecycle</text>
  <text x="80" y="120" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="450" fill="#89A5BE" text-anchor="start">Rollback changes activation history - it does not rewrite an approved version.</text>
  <rect x="80" y="142" width="1440" height="3" rx="2" fill="url(#accent)" opacity="0.8"/>
  <g filter="url(#shadow)"><rect x="90" y="310" width="180" height="110" rx="24" fill="#0D2941" stroke="#89A5BE" stroke-width="3"/><text x="180" y="375" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="750" fill="#89A5BE" text-anchor="middle">Candidate</text></g><line x1="275" y1="365" x2="305" y2="365" stroke="#32D5FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="310" y="310" width="180" height="110" rx="24" fill="#0D2941" stroke="#FF6B6B" stroke-width="3"/><text x="400" y="375" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="750" fill="#FF6B6B" text-anchor="middle">Conflict</text></g><line x1="495" y1="365" x2="525" y2="365" stroke="#32D5FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="530" y="310" width="180" height="110" rx="24" fill="#0D2941" stroke="#32D5FF" stroke-width="3"/><text x="620" y="375" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="750" fill="#32D5FF" text-anchor="middle">Reviewed</text></g><line x1="715" y1="365" x2="745" y2="365" stroke="#32D5FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="750" y="310" width="180" height="110" rx="24" fill="#0D2941" stroke="#34D399" stroke-width="3"/><text x="840" y="375" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="750" fill="#34D399" text-anchor="middle">Approved</text></g><line x1="935" y1="365" x2="965" y2="365" stroke="#32D5FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="970" y="310" width="180" height="110" rx="24" fill="#0D2941" stroke="#2E75FF" stroke-width="3"/><text x="1060" y="375" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="750" fill="#2E75FF" text-anchor="middle">Active</text></g><line x1="1155" y1="365" x2="1185" y2="365" stroke="#32D5FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="1190" y="310" width="180" height="110" rx="24" fill="#0D2941" stroke="#9B8AFB" stroke-width="3"/><text x="1280" y="375" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="750" fill="#9B8AFB" text-anchor="middle">Published</text></g><g filter="url(#shadow)"><rect x="980" y="560" width="390" height="120" rx="24" fill="#13283A" stroke="#F5B84B" stroke-width="3"/><text x="1175" y="604" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="750" fill="#F5B84B" text-anchor="middle">Withdraw / Reactivate</text><text x="1175" y="646" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="500" fill="#FFFFFF" text-anchor="middle">append a new activation event</text></g><path d="M1280 420 C1450 470 1450 540 1370 585" fill="none" stroke="#F5B84B" stroke-width="4" marker-end="url(#arrow)"/><path d="M980 620 C820 720 740 675 840 420" fill="none" stroke="#F5B84B" stroke-width="4" marker-end="url(#arrow)"/><rect x="220" y="735" width="1160" height="72" rx="24" fill="#0B2438" stroke="#2A4963"/><text x="800" y="780" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="650" fill="#FFFFFF" text-anchor="middle">Metric identity stays stable. Versions and activation events remain auditable.</text></svg>